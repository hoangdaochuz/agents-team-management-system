# ExternalSecrets for the aaks-sandbox namespace (executor + clone plane).
# Same Secret Manager keys as the aaks set (see
# k8s/components/external-secrets/externalsecret-aaks.yaml) — ExternalSecrets
# are namespace-scoped, so the sandbox namespace needs its own copies, all
# served by the shared ClusterSecretStore. No values here, references only.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-credentials
  namespace: aaks-sandbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aaks-secretstore
    kind: ClusterSecretStore
  target:
    name: kafka-credentials
    creationPolicy: Owner
  data:
    - secretKey: user
      remoteRef:
        key: aaks-ENV-kafka-sasl-user
    - secretKey: password
      remoteRef:
        key: aaks-ENV-kafka-sasl-password
---
# The executor's database is runner_db (the service was renamed, the DB was
# not — mirrors deploy/postgres/01-create-databases.sql).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: executor-dsn
  namespace: aaks-sandbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aaks-secretstore
    kind: ClusterSecretStore
  target:
    name: executor-dsn
    creationPolicy: Owner
  data:
    - secretKey: dsn
      remoteRef:
        key: aaks-ENV-executor-db-dsn
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: internal-token
  namespace: aaks-sandbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aaks-secretstore
    kind: ClusterSecretStore
  target:
    name: internal-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: aaks-ENV-internal-token
---
# Guards the agent service's internal key-decrypt/MCP endpoints; consumed by
# the executor to fetch decrypted provider keys (which never enter the
# sandbox containers themselves).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-internal-token
  namespace: aaks-sandbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aaks-secretstore
    kind: ClusterSecretStore
  target:
    name: agent-internal-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: aaks-ENV-agent-internal-token
