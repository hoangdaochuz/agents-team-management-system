# Prod executor sizing as a strategic-merge patch (merges by container NAME —
# unlike containers[0]-indexed JSON patches, this survives a sidecar reorder).
# NOTE: `dind` is a native sidecar, so it lives under `initContainers`, not
# `containers` — a `containers:` entry named dind would silently no-op.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
spec:
  # Single replica: one node's view of the clone root (design OQ1).
  replicas: 1
  template:
    spec:
      # Mirror the base pod default (non-root) so this standalone patch keeps
      # its security posture explicit (strategic-merge keeps base values).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: dind
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 3000m
              memory: 6Gi
          # Mirror the base opt-out (rootful daemon): the patch is evaluated
          # standalone by policy scanners, so restate it here.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
      containers:
        - name: executor
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 2Gi
          # Mirror the base pod default (non-root) for the same reason.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
