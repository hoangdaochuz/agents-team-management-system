# Prod executor sizing as a strategic-merge patch (merges by container NAME —
# unlike containers[0]-indexed JSON patches, this survives a sidecar reorder).
# NOTE: `dind` is a native sidecar, so it lives under `initContainers`, not
# `containers` — a `containers:` entry named dind would silently no-op.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
spec:
  # Single replica: one node's view of the clone root (design OQ1).
  replicas: 1
  template:
    spec:
      initContainers:
        - name: dind
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 3000m
              memory: 6Gi
      containers:
        - name: executor
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 2Gi
