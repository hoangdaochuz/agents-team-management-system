apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aaks-sandbox

resources:
  - ../../base
  - env-configmap.yaml

# Image digests — set ONLY by promotion PRs carrying digests that have soaked
# in dev (with links to the CI run that built, scanned, and signed them).
images:
  - name: executor
    newName: us-central1-docker.pkg.dev/your-project-id/aaks/executor
    newTag: sha-PLACEHOLDER
  - name: clone
    newName: us-central1-docker.pkg.dev/your-project-id/aaks/clone
    newTag: sha-PLACEHOLDER

patches:
  # Strategic merge by container name (see executor-sizing.yaml) + the PVC
  # size as a JSON patch.
  - path: executor-sizing.yaml
  - target:
      kind: PersistentVolumeClaim
      name: executor-clone-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Ti
