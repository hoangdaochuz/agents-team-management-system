apiVersion: v1
kind: ConfigMap
metadata:
  name: env-values
  namespace: aaks-sandbox
data:
  # Managed Kafka bootstrap (from infra/envs/prod output `kafka_bootstrap_lookup`):
  # SASL/PLAIN over TLS — credentials come from the kafka-credentials
  # ExternalSecret in this same namespace.
  kafka-brokers: "REPLACE-WITH-PROD-MANAGED-KAFKA-BOOTSTRAP:9092"
  kafka-tls: "true"
  kafka-sasl-mechanism: "PLAIN"

  # Sandbox base image — set ONLY by promotion PRs to a digest that has
  # soaked in dev.
  executor-sandbox-image: "us-central1-docker.pkg.dev/your-project-id/aaks/sandbox:sha-PLACEHOLDER"
  executor-pr-base-url: "https://github.com/your-org/your-repo"

  # Space-separated `git clone` URLs the clone-bootstrap CronJob seeds into
  # the Filestore clone root. Private repos need a `git-credentials` Secret
  # (key `token`) in this namespace.
  clone-repos: "https://github.com/your-org/your-managed-repo.git"
