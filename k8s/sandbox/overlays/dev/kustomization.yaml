apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aaks-sandbox

resources:
  - ../../base
  - env-configmap.yaml

# Image digests — placeholders for CI (`deploy.yml` promote-dev) to replace
# with the exact digests it built, scanned, and signed. Prod promotion copies
# digests that have soaked in dev (never rebuilds).
images:
  - name: executor
    newName: us-central1-docker.pkg.dev/your-project-id/aaks/executor
    newTag: sha-PLACEHOLDER
  - name: clone
    newName: us-central1-docker.pkg.dev/your-project-id/aaks/clone
    newTag: sha-PLACEHOLDER

patches:
  # Small dev sizing: Filestore PVC + DinD sidecar (containers[0]).
  - target:
      kind: PersistentVolumeClaim
      name: executor-clone-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 200Gi
  - target:
      kind: Deployment
      name: executor
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
