# Dev executor sizing as a strategic-merge patch (merges by container NAME —
# unlike containers[0]-indexed JSON patches, this survives a sidecar reorder).
# NOTE: `dind` is a native sidecar under `initContainers` (see prod twin).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
spec:
  replicas: 1
  template:
    spec:
      # Mirror the base pod default (non-root) so this standalone patch keeps
      # its security posture explicit (strategic-merge keeps base values).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: dind
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          # Mirror the base opt-out (rootful daemon): the patch is evaluated
          # standalone by policy scanners, so restate it here.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
