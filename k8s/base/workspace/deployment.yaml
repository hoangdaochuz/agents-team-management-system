# Workspace service = project + task + catalog + resources
# (consolidate-microservices): projects, tasks, the task saga, skills, MCP
# servers and connections — one bounded context over workspace_db.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace
  labels:
    app: workspace
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: workspace
  template:
    metadata:
      labels:
        app: workspace
        tier: backend
    spec:
      serviceAccountName: workspace
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workspace
          image: workspace
          ports:
            - containerPort: 8081
              name: http
              protocol: TCP
          env:
            - name: HTTP_ADDR
              value: ":8081"
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: env-values
                  key: kafka-brokers
            # Managed Kafka: SASL/PLAIN over TLS (see platform/kafka
            # applyAuthFromEnv — unset vars would mean the plaintext path).
            - name: KAFKA_TLS
              valueFrom:
                configMapKeyRef:
                  name: env-values
                  key: kafka-tls
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                configMapKeyRef:
                  name: env-values
                  key: kafka-sasl-mechanism
            - name: KAFKA_SASL_USER
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: user
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: password
            - name: WORKSPACE_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: workspace-dsn
                  key: dsn
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: internal-token
                  key: token
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Slow first boot (Cloud SQL/Kafka dial) must not look dead:
          # startupProbe gates liveness/readiness for up to 5m.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: workspace
  labels:
    app: workspace
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
  selector:
    app: workspace
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: workspace
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: workspace
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace
automountServiceAccountToken: false
