# Identity service = auth + orgs + admin (consolidate-microservices):
# users, sessions, signup, organizations, workspaces, memberships, invites,
# feature flags, audit log — one bounded context over identity_db.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  labels:
    app: identity
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
        tier: backend
    spec:
      serviceAccountName: identity
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: identity
          image: identity
          ports:
            - containerPort: 8085
              name: http
              protocol: TCP
          env:
            - name: HTTP_ADDR
              value: ":8085"
            # Identity uses an in-process dispatch bus (no Kafka).
            - name: IDENTITY_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: identity-dsn
                  key: dsn
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: internal-token
                  key: token
            - name: WORKSPACE_URL
              value: http://workspace.aaks.svc.cluster.local:8081
            # One-shot seed superadmin (consumed at startup).
            - name: AUTH_SEED_SUPERADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: auth-seed-superadmin
                  key: email
            - name: AUTH_SEED_SUPERADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-seed-superadmin
                  key: password
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  labels:
    app: identity
spec:
  type: ClusterIP
  ports:
    - port: 8085
      targetPort: 8085
      protocol: TCP
      name: http
  selector:
    app: identity
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: identity
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: identity
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: identity
automountServiceAccountToken: false
