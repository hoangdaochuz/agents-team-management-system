apiVersion: batch/v1
kind: Job
metadata:
  name: project-migrate
  labels:
    app: migrations
    service: project
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    metadata:
      labels:
        app: migrations
        service: project
    spec:
      restartPolicy: OnFailure
      serviceAccountName: migrations
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # TODO: Pin to specific digest
          image: migrate/migrate:v4.17.1
          command:
            - sh
            - -c
            - |
              /migrate -path /migrations \
                -database "${PROJECT_DB_DSN}" \
                -lock-timeout 5m \
                up
          env:
            - name: PROJECT_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: project-dsn
                  key: dsn
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: migrations
          configMap:
            name: project-migrations
---
