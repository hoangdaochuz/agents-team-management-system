apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
        tier: backend
    spec:
      serviceAccountName: auth
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth
          image: auth
          ports:
            - containerPort: 8087
              name: http
              protocol: TCP
          env:
            - name: HTTP_ADDR
              value: ":8087"
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: env-values
                  key: kafka-brokers
            # Managed Kafka: SASL/PLAIN over TLS (see platform/kafka
            # applyAuthFromEnv — unset vars would mean the plaintext path).
            - name: KAFKA_TLS
              valueFrom:
                configMapKeyRef:
                  name: env-values
                  key: kafka-tls
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                configMapKeyRef:
                  name: env-values
                  key: kafka-sasl-mechanism
            - name: KAFKA_SASL_USER
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: user
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: password
            - name: AUTH_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: auth-dsn
                  key: dsn
            - name: SETTINGS_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: settings-internal-token
                  key: token
            - name: AUTH_SEED_SUPERADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: auth-seed-superadmin
                  key: email
            - name: AUTH_SEED_SUPERADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-seed-superadmin
                  key: password
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8087
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8087
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  labels:
    app: auth
spec:
  type: ClusterIP
  ports:
    - port: 8087
      targetPort: 8087
      protocol: TCP
      name: http
  selector:
    app: auth
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: auth
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth
automountServiceAccountToken: false
