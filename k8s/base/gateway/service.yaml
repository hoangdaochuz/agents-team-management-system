apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
  annotations:
    # Container-native NEGs (pods as endpoints) + the SSE-safe BackendConfig.
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "aaks-gateway"}'
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: gateway
