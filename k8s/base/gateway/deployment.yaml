apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        tier: backend
    spec:
      serviceAccountName: gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: gateway
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: env-values
                  key: kafka-brokers
            # Managed Kafka: SASL/PLAIN over TLS (see platform/kafka
            # applyAuthFromEnv — unset vars would mean the plaintext path).
            - name: KAFKA_TLS
              valueFrom:
                configMapKeyRef:
                  name: env-values
                  key: kafka-tls
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                configMapKeyRef:
                  name: env-values
                  key: kafka-sasl-mechanism
            - name: KAFKA_SASL_USER
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: user
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: password
            # The gateway is a pure reverse proxy: no DB of its own (the
            # other services each carry their <SVC>_DB_DSN).
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: internal-token
                  key: token
            # Four consolidated upstreams (matches deploy/docker-compose.yml).
            # Cluster FQDNs (not short names): the executor lives in the
            # aaks-sandbox namespace, and FQDNs resolve correctly from
            # anywhere — including a future namespace move of the gateway.
            - name: UPSTREAM_IDENTITY
              value: http://identity.aaks.svc.cluster.local:8085
            - name: UPSTREAM_WORKSPACE
              value: http://workspace.aaks.svc.cluster.local:8081
            - name: UPSTREAM_AGENT
              value: http://agent.aaks.svc.cluster.local:8083
            - name: UPSTREAM_EXECUTOR
              value: http://executor.aaks-sandbox.svc.cluster.local:8086
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Slow first boot (Cloud SQL/Kafka dial) must not look dead:
          # startupProbe gates liveness/readiness for up to 5m.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 60
