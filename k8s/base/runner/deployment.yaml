apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner
  labels:
    app: runner
    tier: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: runner
  template:
    metadata:
      labels:
        app: runner
        tier: backend
        aaks/sandbox: "true"
    spec:
      serviceAccountName: runner
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      # Per design D3: schedule on dedicated sandbox pool
      tolerations:
        - key: aaks/sandbox
          operator: Equal
          value: "true"
          effect: NoSchedule
      nodeSelector:
        aaks/sandbox: "true"
      volumes:
        # Shared volume for Docker socket
        - name: dind
          emptyDir: {}
        # Filestore PVC for clone root
        - name: clone
          persistentVolumeClaim:
            claimName: runner-clone-pvc
      initContainers:
        # Pre-pull sandbox image through DinD socket at startup
        - name: pre-pull-sandbox
          image: docker:27.3.1-dind@sha256:7bc418f769fa1147e939170711a520ec21aa0b172dc8c2c5bc8c20646c91de6c
          command:
            - sh
            - -c
            - |
              until docker -H unix:///dind/docker.sock pull "${RUNNER_SANDBOX_IMAGE}"; do
                echo "Waiting for DinD socket and pulling sandbox image..."
                sleep 5
              done
              echo "Sandbox image pre-pulled successfully"
          env:
            - name: RUNNER_SANDBOX_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: env-values
                  key: runner-sandbox-image
          volumeMounts:
            - name: dind
              mountPath: /dind
          securityContext:
            runAsUser: 0
            privileged: true
      containers:
        # DinD sidecar
        - name: dind
          image: docker:27.3.1-dind@sha256:7bc418f769fa1147e939170711a520ec21aa0b172dc8c2c5bc8c20646c91de6c
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: true
            runAsUser: 0
            seccompProfile:
              type: Unconfined
          volumeMounts:
            - name: dind
              mountPath: /var/lib/docker
            - name: dind
              mountPath: /dind
            - name: clone
              mountPath: /clone
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
        # Runner container
        - name: runner
          image: runner
          ports:
            - containerPort: 8086
              name: http
              protocol: TCP
          env:
            - name: HTTP_ADDR
              value: ":8086"
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: env-values
                  key: kafka-brokers
            # Managed Kafka: SASL/PLAIN over TLS (see platform/kafka
            # applyAuthFromEnv — unset vars would mean the plaintext path).
            - name: KAFKA_TLS
              valueFrom:
                configMapKeyRef:
                  name: env-values
                  key: kafka-tls
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                configMapKeyRef:
                  name: env-values
                  key: kafka-sasl-mechanism
            - name: KAFKA_SASL_USER
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: user
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: password
            - name: RUNNER_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: runner-dsn
                  key: dsn
            - name: SETTINGS_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: settings-internal-token
                  key: token
            - name: SETTINGS_URL
              value: http://settings:8085
            - name: RESOURCES_URL
              value: http://resources:8089
            - name: AGENT_URL
              value: http://agent:8083
            - name: RUNNER_PR_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: env-values
                  key: runner-pr-base-url
            # Per design D3: DinD configuration
            - name: RUNNER_SANDBOX
              value: docker
            - name: RUNNER_SANDBOX_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: env-values
                  key: runner-sandbox-image
            - name: RUNNER_DOCKER_SOCKET
              value: /dind/docker.sock
            - name: RUNNER_CLONE_ROOT
              value: /clone
            # RUNNER_DRIVER selects the agent-loop driver (simulated|llm);
            # the sandbox is selected by RUNNER_SANDBOX above.
            - name: RUNNER_DRIVER
              value: simulated
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: dind
              mountPath: /dind
            - name: clone
              mountPath: /clone
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: runner
  labels:
    app: runner
spec:
  type: ClusterIP
  ports:
    - port: 8086
      targetPort: 8086
      protocol: TCP
      name: http
  selector:
    app: runner
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runner-clone-pvc
  labels:
    app: runner
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: filestore
  resources:
    requests:
      storage: 1Ti
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner
automountServiceAccountToken: false
