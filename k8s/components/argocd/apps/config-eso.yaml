# Secret wiring (ClusterSecretStore + ExternalSecrets for `aaks`, wave 2 —
# after the ESO operator registers its CRDs). The sandbox namespace secrets
# ship with the sandbox plane (k8s/sandbox/base/externalsecrets.yaml) off the
# same ClusterSecretStore. Values resolve from Secret Manager at runtime;
# nothing secret is committed (see the gitops-delivery spec).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aaks-config-eso
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: aaks
  source:
    repoURL: https://github.com/hoangdaochuz/agents-team-management-system
    targetRevision: master
    path: k8s/components/external-secrets
  destination:
    namespace: external-secrets
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
