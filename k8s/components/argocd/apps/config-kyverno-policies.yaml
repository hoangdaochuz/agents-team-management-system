# Admission + hardening policy set (k8s/components/kyverno/policies).
# Wave 2 runs after the Kyverno operator itself (wave 1) registers its CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aaks-config-kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: aaks
  source:
    repoURL: https://github.com/hoangdaochuz/agents-team-management-system
    targetRevision: master
    path: k8s/components/kyverno
  destination:
    namespace: kyverno
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
