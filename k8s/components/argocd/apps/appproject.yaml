apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: aaks
  namespace: argocd
spec:
  description: AI Agent Kanban System
  # Pinned to our repo: a `*` source would let any repo's manifests sync.
  sourceRepos:
    - https://github.com/hoangdaochuz/agents-team-management-system
    # Pinned Helm operator sources (see platform-*.yaml).
    - https://kyverno.github.io/kyverno/
    - https://charts.external-secrets.io
    - https://aquasecurity.github.io/helm-charts/
    - https://falcosecurity.github.io/charts
  destinations:
    # Workload namespaces…
    - namespace: aaks
      server: https://kubernetes.default.svc
    - namespace: aaks-sandbox
      server: https://kubernetes.default.svc
    # …plus every namespace a project Application targets: operators install
    # into their own namespaces (platform-*.yaml), configs manage shared ones
    # (config-*.yaml). Argo rejects an Application whose destination is not
    # listed here, so this list must stay in sync with the apps/ directory.
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: kyverno
      server: https://kubernetes.default.svc
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    - namespace: trivy-system
      server: https://kubernetes.default.svc
    - namespace: falco
      server: https://kubernetes.default.svc
    - namespace: default
      server: https://kubernetes.default.svc
  # Only the cluster-scoped kinds this project manages: workload namespaces,
  # the secret store + admission policies, and the RBAC/CRD/webhook kinds the
  # pinned Helm operators install. Anything else is rejected, not defaulted.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: apiregistration.k8s.io
      kind: APIService
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: kyverno.io
      kind: ClusterPolicy
