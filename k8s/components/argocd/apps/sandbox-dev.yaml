# Dev sandbox plane: executor (DinD sidecar + Filestore clone volume) +
# clone-bootstrap CronJob + sandbox secrets/policies (k8s/sandbox/overlays/dev).
# Syncs alongside the dev workloads (same wave) — the planes are independent
# Applications because they live in different namespaces.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aaks-sandbox-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: aaks
  source:
    repoURL: https://github.com/hoangdaochuz/agents-team-management-system
    targetRevision: master
    path: k8s/sandbox/overlays/dev
  destination:
    namespace: aaks-sandbox
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
