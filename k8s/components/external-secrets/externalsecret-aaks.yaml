---
# Internal auth tokens: INTERNAL_TOKEN is shared by all services;
# AGENT_INTERNAL_TOKEN guards the agent service's internal (key-decrypt /
# MCP-hydration) endpoints, consumed by the executor.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
