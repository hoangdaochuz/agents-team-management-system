  name: internal-token
  namespace: aaks
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aaks-secretstore
    kind: ClusterSecretStore
  target:
    name: internal-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: aaks-ENV-internal-token
