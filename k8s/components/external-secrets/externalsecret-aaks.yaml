---
# ONE SecretStore per cluster (dev and prod are separate GKE clusters, each
# installing this component once). Placeholder values — patch or edit when
# bootstrapping a cluster: projectID, clusterLocation, clusterName, and the
# external-secrets service account name (all provisioned by infra/modules/wif).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aaks-secretstore
  namespace: aaks
spec:
  provider:
    gcpsm:
      authType: WorkloadIdentity
      projectID: your-project-id
      clusterID: your-cluster-name
      workloadIdentity:
        clusterLocation: us-central1
        clusterName: your-cluster-name
        serviceAccountRef:
          name: external-secrets
          namespace: aaks
---
# Managed Kafka SASL/PLAIN credentials (consumed as env by every service; the
# Kafka platform layer enables SASL when KAFKA_SASL_USER is set).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-credentials
  namespace: aaks
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aaks-secretstore
    kind: SecretStore
  target:
    name: kafka-credentials
    creationPolicy: Owner
  data:
    # Keys created by infra/modules/managed-kafka — set the <env> suffix to
    # this cluster's environment when bootstrapping (aaks-dev-… / aaks-prod-…).
    - secretKey: user
      remoteRef:
        key: aaks-ENV-kafka-sasl-user
    - secretKey: password
      remoteRef:
        key: aaks-ENV-kafka-sasl-password
---
# Per-service DSN ExternalSecrets (the gateway has no DB — pure proxy)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: project-dsn
  namespace: aaks
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aaks-secretstore
    kind: SecretStore
  target:
    name: project-dsn
    creationPolicy: Owner
  data:
    - secretKey: dsn
      remoteRef:
        key: project-db-dsn
