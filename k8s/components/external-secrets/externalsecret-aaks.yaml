---
# ONE ClusterSecretStore per cluster (dev and prod are separate GKE clusters,
# each installing this component once). Cluster-scoped so BOTH the `aaks`
# and `aaks-sandbox` namespaces can reference it — the executor plane lives
# in aaks-sandbox and needs the same Secret Manager keys. Placeholder values —
# patch or edit when bootstrapping a cluster: projectID, clusterLocation,
# clusterName, and the external-secrets service account (all provisioned by
# infra/modules/wif).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aaks-secretstore
spec:
  provider:
    gcpsm:
      auth:
        workloadIdentity:
          clusterLocation: us-central1
          clusterName: your-cluster-name
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
      projectID: your-project-id
---
# Managed Kafka SASL/PLAIN credentials (consumed as env by every service; the
# Kafka platform layer enables SASL when KAFKA_SASL_USER is set).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-credentials
  namespace: aaks
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aaks-secretstore
    kind: ClusterSecretStore
  target:
    name: kafka-credentials
    creationPolicy: Owner
  data:
    # Keys created by infra/modules/managed-kafka — set the <env> suffix to
    # this cluster's environment when bootstrapping (aaks-dev-… / aaks-prod-…).
    - secretKey: user
      remoteRef:
        key: aaks-ENV-kafka-sasl-user
    - secretKey: password
      remoteRef:
        key: aaks-ENV-kafka-sasl-password
---
# Per-service DSN ExternalSecrets (the gateway has no DB — pure proxy).
# Four logical databases after consolidate-microservices; the executor's
# remote key keeps the runner_db name (the service was renamed, the DB was not).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: identity-dsn
  namespace: aaks
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aaks-secretstore
    kind: ClusterSecretStore
  target:
    name: identity-dsn
    creationPolicy: Owner
  data:
    - secretKey: dsn
      remoteRef:
        key: aaks-ENV-identity-db-dsn
---
