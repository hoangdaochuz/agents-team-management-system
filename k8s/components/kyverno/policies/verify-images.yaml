# Image trust: only the project's Artifact Registry, and only images signed
# by the project's CI (Cosign keyless). Two rules:
#   1. origin      — every image comes from the Artifact Registry, with one
#                    narrowly-scoped exception: the executor's Docker-in-Docker
#                    daemon image (Docker Hub, digest-pinned in the manifest).
#   2. signature   — registry images must verify against the keyless
#                    attestation produced by the deploy workflow.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-images
spec:
  validationFailureAction: Enforce
  background: true
  webhookTimeoutSeconds: 30
  rules:
    - name: require-artifact-registry-origin
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          # Platform components bring their own upstream images; they are
          # managed by their own installers, not our pipeline.
          - resources:
              kinds: [Pod]
              namespaces: [kube-system, argocd, kyverno, external-secrets, trivy-system, falco, gatekeeper-system]
      validate:
        message: "Images must come from the project's Artifact Registry (the executor's digest-pinned DinD daemon is the only exception)."
        foreach:
          - list: "request.object.spec.containers"
            pattern:
              image: ("?*docker.pkg.dev/*", "docker:27.3.1-dind@sha256:7bc418f769fa1147e939170711a520ec21aa0b172dc8c2c5bc8c20646c91de6c")
          - list: "request.object.spec.initContainers || `[]`"
            pattern:
              image: ("?*docker.pkg.dev/*", "docker:27.3.1-dind@sha256:7bc418f769fa1147e939170711a520ec21aa0b172dc8c2c5bc8c20646c91de6c")
          # Debug/troubleshooting containers must not smuggle an untrusted
          # image past admission either.
          - list: "request.object.spec.ephemeralContainers || `[]`"
            pattern:
              image: ("?*docker.pkg.dev/*", "docker:27.3.1-dind@sha256:7bc418f769fa1147e939170711a520ec21aa0b172dc8c2c5bc8c20646c91de6c")

    - name: verify-cosign-signature
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [kube-system, argocd, kyverno, external-secrets, trivy-system, falco, gatekeeper-system]
      verifyImages:
        - imageReferences:
            - "*docker.pkg.dev/*"
          mutateDigest: true
          verifyDigest: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    # Keyless certificate identity for the deploy workflow:
                    # replace your-org with the GitHub org when bootstrapping.
                    subject: "https://github.com/your-org/agents-team-management-system/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: "https://rekor.sigstore.dev"
