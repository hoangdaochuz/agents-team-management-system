apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-immutable-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - kube-system
                - argocd
                - kyverno
      validate:
        message: "Image tags using 'latest' are not allowed."
        foreach:
          # Bare `image: gateway` (no tag at all) must ALSO fail: untagged
          # pulls resolve to `:latest` at runtime, so the negation alone
          # would bless exactly what it means to forbid. CI promotion always
          # writes `name@digest`, which satisfies both patterns.
          - list: request.object.spec.containers
            context: []
            pattern:
              image: "*:*"
          - list: request.object.spec.containers
            context: []
            pattern:
              image: "!*:latest"
          - list: request.object.spec.initContainers
            context: []
            pattern:
              image: "*:*"
          - list: request.object.spec.initContainers
            context: []
            pattern:
              image: "!*:latest"
          # Debug ephemerals bypass nothing: same two patterns.
          - list: request.object.spec.ephemeralContainers || `[]`
            context: []
            pattern:
              image: "*:*"
          - list: request.object.spec.ephemeralContainers || `[]`
            context: []
            pattern:
              image: "!*:latest"
