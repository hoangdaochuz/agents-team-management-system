apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Admission + hardening policy set. The Kyverno OPERATOR itself is installed
  # by Argo CD from the pinned Helm chart (see
  # components/argocd/apps/platform-kyverno.yaml) — remote kustomize refs to
  # upstream repos are intentionally not used (most upstreams don't ship
  # kustomizations, and unpinned remotes would float).
  - policies/
