apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aaks

resources:
  - ../../base
  - namespace.yaml
  - filestore-storage-class.yaml
  - ingress.yaml
  - env-configmap.yaml

# Image tags - placeholders for CI to replace with actual digests.
# (The executor + clone + sandbox images live in k8s/sandbox/overlays/dev —
# the privileged plane has its own namespace and overlay.)
images:
  - name: gateway
    newName: us-docker.pkg.dev/your-project-id/aaks/gateway
    newTag: sha-PLACEHOLDER
  - name: identity
    newName: us-docker.pkg.dev/your-project-id/aaks/identity
    newTag: sha-PLACEHOLDER
  - name: workspace
    newName: us-docker.pkg.dev/your-project-id/aaks/workspace
    newTag: sha-PLACEHOLDER
  - name: agent
    newName: us-docker.pkg.dev/your-project-id/aaks/agent
    newTag: sha-PLACEHOLDER
  - name: web
    newName: us-docker.pkg.dev/your-project-id/aaks/web
    newTag: sha-PLACEHOLDER
  - name: migrate
    newName: us-docker.pkg.dev/your-project-id/aaks/migrate
    newTag: sha-PLACEHOLDER

# ConfigMap generator for migration files (to be populated by CI)
configMapGenerator:
  - name: identity-migrations
    files:
      - placeholder.sql=migrations-placeholder/identity.sql
    options:
      disableNameSuffixHash: true
  - name: workspace-migrations
    files:
      - placeholder.sql=migrations-placeholder/workspace.sql
    options:
      disableNameSuffixHash: true
  - name: agent-migrations
    files:
      - placeholder.sql=migrations-placeholder/agent.sql
    options:
      disableNameSuffixHash: true
  - name: executor-migrations
    files:
      - placeholder.sql=migrations-placeholder/executor.sql
    options:
      disableNameSuffixHash: true
