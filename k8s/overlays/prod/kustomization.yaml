apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aaks

resources:
  - ../../base
  - namespace.yaml
  - filestore-storage-class.yaml
  - ingress.yaml
  - env-configmap.yaml

# Image tags - placeholders for CI to replace with actual digests
images:
  - name: gateway
    newName: us-docker.pkg.dev/your-project-id/aaks/gateway
    newTag: sha-PLACEHOLDER
  - name: project
    newName: us-docker.pkg.dev/your-project-id/aaks/project
    newTag: sha-PLACEHOLDER
  - name: task
    newName: us-docker.pkg.dev/your-project-id/aaks/task
    newTag: sha-PLACEHOLDER
  - name: agent
    newName: us-docker.pkg.dev/your-project-id/aaks/agent
    newTag: sha-PLACEHOLDER
  - name: catalog
    newName: us-docker.pkg.dev/your-project-id/aaks/catalog
    newTag: sha-PLACEHOLDER
  - name: settings
    newName: us-docker.pkg.dev/your-project-id/aaks/settings
    newTag: sha-PLACEHOLDER
  - name: runner
    newName: us-docker.pkg.dev/your-project-id/aaks/runner
    newTag: sha-PLACEHOLDER
  - name: auth
    newName: us-docker.pkg.dev/your-project-id/aaks/auth
    newTag: sha-PLACEHOLDER
  - name: orgs
    newName: us-docker.pkg.dev/your-project-id/aaks/orgs
    newTag: sha-PLACEHOLDER
  - name: resources
    newName: us-docker.pkg.dev/your-project-id/aaks/resources
    newTag: sha-PLACEHOLDER
  - name: admin
    newName: us-docker.pkg.dev/your-project-id/aaks/admin
    newTag: sha-PLACEHOLDER
  - name: web
    newName: us-docker.pkg.dev/your-project-id/aaks/web
    newTag: sha-PLACEHOLDER

# Prod-specific sizing patches
patches:
  # Increase replicas for HA
  - target:
      kind: Deployment
      name: gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  - target:
      kind: Deployment
      name: project
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  - target:
      kind: Deployment
      name: task
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  - target:
      kind: Deployment
      name: agent
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  - target:
      kind: Deployment
      name: catalog
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  - target:
      kind: Deployment
      name: settings
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  - target:
      kind: Deployment
      name: auth
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  - target:
      kind: Deployment
      name: orgs
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  - target:
      kind: Deployment
      name: resources
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  - target:
      kind: Deployment
      name: admin
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 128Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
  # Runner: single replica (same as dev) but larger limits
  - target:
      kind: Deployment
      name: runner
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/1/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/1/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/1/resources/limits/cpu
        value: 1500m
      - op: replace
        path: /spec/template/spec/containers/1/resources/limits/memory
        value: 2Gi
  # DinD: larger for prod
  - target:
      kind: Deployment
      name: runner
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 3000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 6Gi
  # Larger PVC for prod
  - target:
      kind: PersistentVolumeClaim
      name: runner-clone-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Ti  # Full size for prod

# ConfigMap generator for migration files (to be populated by CI)
configMapGenerator:
