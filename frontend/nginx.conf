# SPA server + /api reverse proxy (same-origin, SSE-safe).
#
# Rendered by the nginx-unprivileged image's envsubst template step
# (COPY to /etc/nginx/templates/): only the AAKS_* env vars are substituted;
# nginx's own $host/$remote_addr etc. are left intact. Defaults come from the
# Dockerfile ENV; k8s manifests can override per environment.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress everything textual the SPA ships.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Immutable hashed assets; the HTML entry must never be cached stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API + SSE stream -> Gateway. Buffering off and HTTP/1.1 so
    # /api/tasks/:id/stream steps reach the browser as they happen.
    # The upstream goes through a variable + resolver so the hostname is
    # resolved per request: with a literal proxy_pass nginx resolves at startup
    # and refuses to boot when the gateway is unreachable (a gateway outage
    # must not take the SPA down with it).
    resolver ${AAKS_RESOLVER} valid=5s ipv6=off;
    location /api/ {
        set $gateway_upstream http://${AAKS_GATEWAY_UPSTREAM};
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Liveness/readiness for the SPA container (no fallback: a probe must not
    # be satisfied by the SPA shell).
    location = /healthz {
        access_log off;
        return 200;
    }

    # SPA fallback: every non-file route renders the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
