# Deploy pipeline: builds each image exactly once on master (after ci passes),
# gates on Trivy, generates SBOMs, signs keyless with Cosign, then promotes the
# digests to the dev overlays (workloads + sandbox; prod is a manual promotion PR).
#
# Images (9): the 5 consolidated services (gateway/identity/workspace/agent via
# the shared distroless Dockerfile, executor via the git-capable variant), the
# SPA, the sandbox base, plus clone (clone-bootstrap CronJob) and migrate
# (migration PreSync Jobs) — the last two are CI-built so every image the
# cluster runs originates in our Artifact Registry (Kyverno verify-images).
#
# Operator repository VARIABLES required:
#   GCP_WIF_PROVIDER  projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   GCP_SA            <ci-sa>@<project>.iam.gserviceaccount.com        (roles/artifactregistry.writer)
#   GCP_REGISTRY      us-central1-docker.pkg.dev                       (registry host)
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The 5 consolidated services. gateway/identity/workspace/agent use
          # the shared distroless Dockerfile; executor uses the git-capable
          # variant (it execs `git worktree` host-side).
          - name: gateway
            dockerfile: deploy/service.Dockerfile
            context: ./backend
          - { name: identity,  dockerfile: deploy/service.Dockerfile, context: ./backend }
          - { name: workspace, dockerfile: deploy/service.Dockerfile, context: ./backend }
          - { name: agent,     dockerfile: deploy/service.Dockerfile, context: ./backend }
          - { name: executor,  dockerfile: deploy/runner.Dockerfile,  context: ./backend }
          # SPA
          - { name: web, dockerfile: frontend/Dockerfile, context: ./frontend }
          # Credential-less sandbox base image
          - { name: sandbox, dockerfile: backend/runner/Dockerfile, context: ./backend }
          # Clone-bootstrap (git + ca-certs on pinned alpine) and migration
          # runner (pinned upstream golang-migrate, repushed to our registry)
          - { name: clone, dockerfile: deploy/clone.Dockerfile, context: ./backend }
          - { name: migrate, dockerfile: deploy/migrate.Dockerfile, context: ./backend }
    steps:
      - name: Guard on CI success
        if: github.event.workflow_run.conclusion != 'success'
        run: exit 1

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to GCP (OIDC, no stored keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Login to Artifact Registry
        run: echo "AR_TOKEN=$(gcloud auth print-access-token)" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ env.AR_TOKEN }}

      - name: Build and push (once, by commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.name != 'web' && matrix.name != 'sandbox' && matrix.name != 'executor' && matrix.name != 'clone' && matrix.name != 'migrate' && format('SERVICE={0}', matrix.name) || '' }}
          push: true
          tags: ${{ vars.GCP_REGISTRY }}/aaks/${{ matrix.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan-sign-publish:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        name: [gateway, identity, workspace, agent, executor, web, sandbox, clone, migrate]
    env:
      IMAGE: ${{ vars.GCP_REGISTRY }}/aaks/${{ matrix.name }}:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (OIDC, no stored keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Login to Artifact Registry
        run: echo "AR_TOKEN=$(gcloud auth print-access-token)" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ env.AR_TOKEN }}

      # Vulnerability gate: a critical CVE stops promotion dead.
      - name: Trivy image scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          exit-code: 1
          format: sarif
          output: trivy-report.sarif

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif-${{ matrix.name }}
          path: trivy-report.sarif

      - name: Generate SBOM (Syft, SPDX-JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}
          tool: syft
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        run: cosign sign --yes "$IMAGE"

      - name: Attest SBOM
        run: cosign attest --yes --predicate sbom.spdx.json --type spdx "$IMAGE"

      - name: Verify signature (smoke)
        run: |
          cosign verify "$IMAGE" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

  promote-dev:
    runs-on: ubuntu-latest
    needs: scan-sign-publish
    steps:
      - uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN pushes do not re-trigger workflows (recursion guard):
          # the promotion commit only moves digests, which ci's iac-validate
          # already covers on the next real change.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: imranismail/setup-kustomize@v3

      - name: Authenticate to GCP (OIDC, no stored keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Promote by DIGEST (immutable), not tag: resolve each sha-tag to its
      # digest so the overlay records exactly what CI built, scanned and signed.
      # Two overlay trees: workloads (aaks ns) and sandbox (aaks-sandbox ns).
      # The sandbox BASE image is config, not a workload image — its digest
      # rides in the sandbox env-values ConfigMap (executor-sandbox-image).
      - name: Promote images to dev overlays (by digest)
        run: |
          promote() { # $1 = overlay dir, $@ = image names
            local dir="$1"; shift
            cd "$dir"
            for name in "$@"; do
              digest="$(gcloud artifacts docker images describe \
                "${{ vars.GCP_REGISTRY }}/aaks/${name}:sha-${{ github.sha }}" \
                --format='value(image_summary.digest)')"
              kustomize edit set image "${name}=${{ vars.GCP_REGISTRY }}/aaks/${name}@${digest}"
            done
            cd - >/dev/null
          }
          promote k8s/overlays/dev gateway identity workspace agent web migrate
          promote k8s/sandbox/overlays/dev executor clone
          sandbox_digest="$(gcloud artifacts docker images describe \
            "${{ vars.GCP_REGISTRY }}/aaks/sandbox:sha-${{ github.sha }}" \
            --format='value(image_summary.digest)')"
          sed -i -E "s|^(  executor-sandbox-image: ).*|\1\"${{ vars.GCP_REGISTRY }}/aaks/sandbox@${sandbox_digest}\"|" \
            k8s/sandbox/overlays/dev/env-configmap.yaml

      - name: Commit and push promotion
        run: |
          git add k8s/overlays/dev k8s/sandbox/overlays/dev
          if git diff --staged --quiet; then
            echo "No promotion changes"; exit 0
          fi
          git commit -m "promote dev images sha-${GITHUB_SHA::7}"
          git push origin master
