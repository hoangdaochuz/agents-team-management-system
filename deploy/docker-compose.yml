# Event-driven microservices deployment (single-operator MVP).
#
# Infrastructure only here: Postgres (6 logical DBs via init script) + Kafka
# (KRaft, no Zookeeper). The per-service containers (gateway, project, task,
# agent, catalog, settings, runner) and the separate frontend are added in
# phase 9 (task 9.1) once the services exist.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aaks
      POSTGRES_PASSWORD: aaks
      # Default DB kept for tooling; the 6 service DBs are created by the init
      # script mounted below (see deploy/postgres/01-create-databases.sql).
      POSTGRES_DB: aaks
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aaks -d aaks"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # KRaft mode — single node acting as both controller and broker, no
    # Zookeeper dependency (per the event-bus spec: KRaft deployment).
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Topics are partitioned by task_id at publish time; 6 partitions is enough
      # for a single-operator MVP and supports future parallelism.
      KAFKA_CFG_NUM_PARTITIONS: "6"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"
    volumes:
      - kafkadata:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  kafkadata:
  # aaks-data volume (shared worktree storage) is re-added in phase 9 when the
  # runner / sandbox containers are wired.
