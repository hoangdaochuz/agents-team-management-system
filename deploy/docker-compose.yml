# Consolidated microservices deployment (single-operator MVP).
#
# Infra: Postgres (4 logical DBs via init script) + Kafka (KRaft, no
# Zookeeper) + the 4 consolidated service containers (identity, workspace,
# agent, executor) + the Gateway. The frontend SPA is served separately
# (`make web-dev` or a static host) and talks to the Gateway on :8080.
#
# Secrets discipline (design D7): no provider keys or git credentials in env —
# the Agent service stores them encrypted at rest (AGENT_MASTER_KEY) and
# serves plaintext only over the internal token-gated path. The master key and
# the shared internal token are dev defaults here; a deploy/.env overrides them
# (see .env.example), and production would source them from a vault.
x-common: &svc-base
  build:
    context: ../backend
    dockerfile: ../deploy/service.Dockerfile
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
  environment: &svc-env
    KAFKA_BROKERS: kafka:9092
    POSTGRES_USER: aaks
    POSTGRES_PASSWORD: aaks
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    # Secrets default to dev values but honor deploy/.env — an operator
    # rotating AGENT_MASTER_KEY in .env must actually rotate it.
    AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-dev-internal-token}
    AGENT_MASTER_KEY: ${AGENT_MASTER_KEY:-dev-master-key-0123456789abcdef}
    # Shared service-to-service token guarding every /internal/* endpoint
    # (unset would leave them open to anything on the compose network).
    INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aaks
      POSTGRES_PASSWORD: aaks
      POSTGRES_DB: aaks
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    ports:
      # Loopback-only: host exposure is for dev inspection; binding all
      # interfaces would expose the DB to anything with host reach — including
      # LLM-directed task containers.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aaks -d aaks"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # KRaft mode — single node acting as both controller and broker, no
    # Zookeeper dependency (per the event-bus spec: KRaft deployment). Uses the
    # official Apache image (env vars are KAFKA_<UPPERSCORED_PROP>).
    image: apache/kafka:3.7.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "6"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      # KRaft cluster id (base64, 22 chars) — the apache entrypoint formats
      # storage against this on first boot.
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15

  kafka-init:
    # One-shot: pre-create __consumer_offsets. On KRaft the broker lazily
    # auto-creates it, but under some single-node configs the coordinator
    # never becomes available and every consumer group spins on
    # "The coordinator is not available". Creating the topic up-front makes
    # group coordination deterministic.
    image: apache/kafka:3.7.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--create", "--topic", "__consumer_offsets", "--partitions", "50", "--replication-factor", "1", "--config", "cleanup.policy=compact", "--if-not-exists"]
    restart: "no"

  # ── Consolidated services ──────────────────────────────────────────────────
  identity:
    # Auth + Orgs + Admin: users/sessions/signup, orgs/workspaces/members/
    # invites, audit log, feature flags, sysadmin. No Kafka traffic: the
    # former signup/invite/audit events dispatch in-process.
    <<: *svc-base
    build:
      context: ../backend
      dockerfile: ../deploy/service.Dockerfile
      args: { SERVICE: identity, PORT: "8085" }
    environment:
      <<: *svc-env
      HTTP_ADDR: ":8085"
      IDENTITY_DB_DSN: postgres://aaks:aaks@postgres:5432/identity_db
      # Workspace provisioning (the former workspace.created event).
      WORKSPACE_URL: http://workspace:8081
      AUTH_SEED_SUPERADMIN_EMAIL: ${AUTH_SEED_SUPERADMIN_EMAIL:-admin@aaks.dev}
      AUTH_SEED_SUPERADMIN_PASSWORD: ${AUTH_SEED_SUPERADMIN_PASSWORD:-adminpass123}

  workspace:
    # Project + Task + Catalog + Resources: projects, tasks/feedback + the
    # lifecycle saga (Kafka to the Executor), skills/MCP catalog, knowledge/
    # plugins/rules/MCP connections.
    <<: *svc-base
    build:
      context: ../backend
      dockerfile: ../deploy/service.Dockerfile
      args: { SERVICE: workspace, PORT: "8081" }
    environment:
      <<: *svc-env
      HTTP_ADDR: ":8081"
      WORKSPACE_DB_DSN: postgres://aaks:aaks@postgres:5432/workspace_db

  agent:
    # Agent + Settings: agent CRUD + skill/MCP attachments, sole decryptor of
    # provider keys (encrypted at rest; plaintext only over the internal
    # token-gated path).
    <<: *svc-base
    build:
      context: ../backend
      dockerfile: ../deploy/service.Dockerfile
      args: { SERVICE: agent, PORT: "8083" }
    environment:
      <<: *svc-env
      HTTP_ADDR: ":8083"
      AGENT_DB_DSN: postgres://aaks:aaks@postgres:5432/agent_db
      # Hydrate an agent's attached MCP server definitions from the Workspace
      # catalog.
      WORKSPACE_URL: http://workspace:8081

  executor:
    # Runner (renamed): Docker sandbox driver, agent loop, step streaming.
    # Its failure modes are fundamentally different from the CRUD services,
    # so it stays standalone.
    <<: *svc-base
    build:
      context: ../backend
      dockerfile: ../deploy/service.Dockerfile
      args: { SERVICE: executor, PORT: "8086" }
    environment:
      <<: *svc-env
      HTTP_ADDR: ":8086"
      EXECUTOR_DB_DSN: postgres://aaks:aaks@postgres:5432/runner_db
      EXECUTOR_DRIVER: ${EXECUTOR_DRIVER:-simulated}
      AGENT_URL: http://agent:8083
      WORKSPACE_URL: http://workspace:8081
      EXECUTOR_PR_BASE_URL: ${EXECUTOR_PR_BASE_URL:-https://github.com/example/repo}
      # Sandbox: off by default — the simulated driver needs none.
      EXECUTOR_SANDBOX: ${EXECUTOR_SANDBOX:-none}
      EXECUTOR_SANDBOX_IMAGE: ${EXECUTOR_SANDBOX_IMAGE:-aaks-runner:latest}
      EXECUTOR_DOCKER_SOCKET: /var/run/docker.sock
      EXECUTOR_CLONE_ROOT: ${EXECUTOR_CLONE_ROOT:-/var/lib/aaks/clone}
      # Task-container network egress: "none" (pure sandbox, default) or
      # "bridge" when tasks need dependency installs.
      EXECUTOR_SANDBOX_NETWORK: ${EXECUTOR_SANDBOX_NETWORK:-none}

  # ── Gateway (BFF, sole HTTP entrypoint) ────────────────────────────────────
  gateway:
    <<: *svc-base
    build:
      context: ../backend
      dockerfile: ../deploy/service.Dockerfile
      args: { SERVICE: gateway, PORT: "8080" }
    environment:
      <<: *svc-env
      HTTP_ADDR: ":8080"
      UPSTREAM_IDENTITY: http://identity:8085
      UPSTREAM_WORKSPACE: http://workspace:8081
      UPSTREAM_AGENT: http://agent:8083
      UPSTREAM_EXECUTOR: http://executor:8086
    ports:
      - "8080:8080"
    depends_on:
      identity:
        condition: service_started
      workspace:
        condition: service_started
      agent:
        condition: service_started
      executor:
        condition: service_started

volumes:
  pgdata:
  kafkadata:
