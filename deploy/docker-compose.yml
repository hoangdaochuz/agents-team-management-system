# Event-driven microservices deployment (single-operator MVP).
#
# Infra: Postgres (10 logical DBs via init script) + Kafka (KRaft, no
# Zookeeper) + the 10 service containers + the Gateway. The frontend SPA is
# served separately (`make web-dev` or a static host) and talks to the Gateway
# on :8080.
#
# Secrets discipline (design D7): no provider keys or git credentials in env —
# the Settings service stores them encrypted at rest (SETTINGS_MASTER_KEY) and
# serves plaintext only over the internal mTLS+token path. The master key and
# the internal token are shared dev secrets here; production would source them
# from a vault.
x-common: &svc-base
  build:
    context: ../backend
    dockerfile: ../deploy/service.Dockerfile
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
  environment: &svc-env
    KAFKA_BROKERS: kafka:9092
    POSTGRES_USER: aaks
    POSTGRES_PASSWORD: aaks
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    SETTINGS_INTERNAL_TOKEN: dev-internal-token
    SETTINGS_MASTER_KEY: dev-master-key-0123456789abcdef

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aaks
      POSTGRES_PASSWORD: aaks
      POSTGRES_DB: aaks
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aaks -d aaks"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # KRaft mode — single node acting as both controller and broker, no
    # Zookeeper dependency (per the event-bus spec: KRaft deployment). Uses the
    # official Apache image (env vars are KAFKA_<UPPERSCORED_PROP>).
    image: apache/kafka:3.7.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "6"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      # KRaft cluster id (base64, 22 chars) — the apache entrypoint formats
      # storage against this on first boot.
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15

  # ── Core services ──────────────────────────────────────────────────────────
  kafka-init:
    # One-shot: pre-create __consumer_offsets. On KRaft the broker lazily
    # auto-creates it, but under some single-node configs the coordinator
    # never becomes available and every consumer group spins on
    # "The coordinator is not available". Creating the topic up-front makes
    # group coordination deterministic.
    image: apache/kafka:3.7.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--create", "--topic", "__consumer_offsets", "--partitions", "50", "--replication-factor", "1", "--config", "cleanup.policy=compact", "--if-not-exists"]
    restart: "no"

  project:
    <<: *svc-base
    build:
      context: ../backend
      dockerfile: ../deploy/service.Dockerfile
      args: { SERVICE: project, PORT: "8081" }
    environment:
      <<: *svc-env
      HTTP_ADDR: ":8081"
      PROJECT_DB_DSN: postgres://aaks:aaks@postgres:5432/project_db

  task:
    <<: *svc-base
    build:
      context: ../backend
      dockerfile: ../deploy/service.Dockerfile
      args: { SERVICE: task, PORT: "8082" }
    environment:
      <<: *svc-env
      HTTP_ADDR: ":8082"
      TASK_DB_DSN: postgres://aaks:aaks@postgres:5432/task_db

  agent:
    <<: *svc-base
    build:
      context: ../backend
      dockerfile: ../deploy/service.Dockerfile
      args: { SERVICE: agent, PORT: "8083" }
    environment:
      <<: *svc-env
      HTTP_ADDR: ":8083"
      AGENT_DB_DSN: postgres://aaks:aaks@postgres:5432/agent_db
      # Hydrate an agent's attached MCP server definitions from Catalog (task 5.5).
      CATALOG_URL: http://catalog:8084

  catalog:
    <<: *svc-base
    build:
      context: ../backend
      dockerfile: ../deploy/service.Dockerfile
      args: { SERVICE: catalog, PORT: "8084" }
    environment:
      <<: *svc-env
      HTTP_ADDR: ":8084"
      CATALOG_DB_DSN: postgres://aaks:aaks@postgres:5432/catalog_db

  settings:
    <<: *svc-base
    build:
      context: ../backend
      dockerfile: ../deploy/service.Dockerfile
      args: { SERVICE: settings, PORT: "8085" }
    environment:
      <<: *svc-env
      HTTP_ADDR: ":8085"
      SETTINGS_DB_DSN: postgres://aaks:aaks@postgres:5432/settings_db

  runner:
    <<: *svc-base
    build:
      context: ../backend
      dockerfile: ../deploy/service.Dockerfile
      args: { SERVICE: runner, PORT: "8086" }
    environment:
      <<: *svc-env
      HTTP_ADDR: ":8086"
      RUNNER_DB_DSN: postgres://aaks:aaks@postgres:5432/runner_db
      RUNNER_DRIVER: simulated
      SETTINGS_URL: http://settings:8085
      RESOURCES_URL: http://resources:8089
      AGENT_URL: http://agent:8083
      RUNNER_PR_BASE_URL: https://github.com/example/repo
      # Sandbox (task 5.1): off by default — the simulated driver needs none.
      RUNNER_SANDBOX: ${RUNNER_SANDBOX:-none}
      RUNNER_SANDBOX_IMAGE: ${RUNNER_SANDBOX_IMAGE:-aaks-runner:latest}
      RUNNER_DOCKER_SOCKET: /var/run/docker.sock
      RUNNER_CLONE_ROOT: ${RUNNER_CLONE_ROOT:-/var/lib/aaks/clone}

  # ── Multi-tenant plane (phases 10–13) ──────────────────────────────────────
  auth:
    <<: *svc-base
    build:
      context: ../backend
      dockerfile: ../deploy/service.Dockerfile
      args: { SERVICE: auth, PORT: "8087" }
    environment:
      <<: *svc-env
      HTTP_ADDR: ":8087"
      AUTH_DB_DSN: postgres://aaks:aaks@postgres:5432/auth_db
      AUTH_SEED_SUPERADMIN_EMAIL: admin@aaks.dev
      AUTH_SEED_SUPERADMIN_PASSWORD: adminpass123

  orgs:
    <<: *svc-base
    build:
      context: ../backend
      dockerfile: ../deploy/service.Dockerfile
      args: { SERVICE: orgs, PORT: "8088" }
    environment:
      <<: *svc-env
      HTTP_ADDR: ":8088"
      ORGS_DB_DSN: postgres://aaks:aaks@postgres:5432/orgs_db

  resources:
    <<: *svc-base
    build:
      context: ../backend
      dockerfile: ../deploy/service.Dockerfile
      args: { SERVICE: resources, PORT: "8089" }
    environment:
      <<: *svc-env
      HTTP_ADDR: ":8089"
      RESOURCES_DB_DSN: postgres://aaks:aaks@postgres:5432/resources_db

  admin:
    <<: *svc-base
    build:
      context: ../backend
      dockerfile: ../deploy/service.Dockerfile
      args: { SERVICE: admin, PORT: "8090" }
    environment:
      <<: *svc-env
      HTTP_ADDR: ":8090"
      ADMIN_DB_DSN: postgres://aaks:aaks@postgres:5432/admin_db

  # ── Gateway (BFF, sole HTTP entrypoint) ────────────────────────────────────
  gateway:
    <<: *svc-base
    build:
      context: ../backend
      dockerfile: ../deploy/service.Dockerfile
      args: { SERVICE: gateway, PORT: "8080" }
    environment:
      <<: *svc-env
      HTTP_ADDR: ":8080"
      UPSTREAM_PROJECT: http://project:8081
      UPSTREAM_TASK: http://task:8082
      UPSTREAM_AGENT: http://agent:8083
      UPSTREAM_CATALOG: http://catalog:8084
      UPSTREAM_SETTINGS: http://settings:8085
      UPSTREAM_RUNNER: http://runner:8086
      UPSTREAM_AUTH: http://auth:8087
      UPSTREAM_ORGS: http://orgs:8088
      UPSTREAM_RESOURCES: http://resources:8089
      UPSTREAM_ADMIN: http://admin:8090
    ports:
      - "8080:8080"
    depends_on:
      project:
        condition: service_started
      task:
        condition: service_started
      agent:
        condition: service_started
      catalog:
        condition: service_started
      settings:
        condition: service_started
      runner:
        condition: service_started
      auth:
        condition: service_started
      orgs:
        condition: service_started
      resources:
        condition: service_started
      admin:
        condition: service_started

volumes:
  pgdata:
  kafkadata:
